name: glogemflow_icetemp
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # numpy/scipy are capped below 2.4/1.17 (rather than the icetemp-only floor
  # further down) because `surmise` (Tier-3 Bayesian calibration emulator,
  # see src/icetemp/calibration/) hard-pins numpy<2.2.0 and scipy<1.15.0;
  # installing surmise into this env downgrades from the previous
  # numpy>=2.4/scipy>=1.17 floor, so the floor is relaxed here to match what
  # is actually installed and tested (numpy 2.1.3, scipy 1.14.1).
  - numpy>=2.1,<2.2
  - pandas>=3.0
  - scipy>=1.14,<1.15
  - matplotlib>=3.10
  - jupyter
  - jupyterlab
  - ipykernel
  - xarray
  - netcdf4         # xarray backend for ERA5 .nc files
  - scikit-learn>=1.9
  - pyyaml>=6.0     # icetemp.calibration.config.CalibrationConfig (YAML run configs)
  - pip
  - pip:
    - cmcrameri>=1.8
    # --- Tier-3 Bayesian (Kennedy-O'Hagan) calibration, src/icetemp/calibration/ ---
    - emcee>=3.1        # gradient-free ensemble MCMC sampler for the KO posterior
    - tqdm>=4.65         # progress bar for real (thousands-of-steps) emcee runs
    - surmise>=0.4       # PCGPwM Gaussian-process emulator (SVD-reduced profiles -> theta)
    - arviz>=0.23        # MCMC convergence diagnostics (R-hat, ESS, autocorrelation)
    - corner>=2.3        # posterior corner/marginal plots
