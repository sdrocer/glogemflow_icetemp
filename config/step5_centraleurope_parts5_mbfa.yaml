# Step 5 redone on the free-air mass balance (plan development_history/plans/2026-10-29_freeair_mb_icetemp_plan.md,
# approved by Janosch on 29 Oct; step 6 of plans/2026-10-28_freeair_mass_balance_plan.md). A copy of
# step5_centraleurope_parts5.yaml in which only the mass balance changes:
# - air_temperature: freeair, GloGEM's mass balance on ERA5's free air too, with the gradual change to the 2 m air
#   over 400 m below the climate cell's ground (GloGEM freeair-mb, GloGEM_wt_mbfreeair);
# - the mass-balance calibration of all Alpine glaciers made on that air (mbfreeair/step3/cal_fa, by the free-air
#   session), all its files;
# - the orientation factors rebuilt on its melt (week3/orient_parts5_mbfa);
# - the run tags s6 (grid s6g00-07, start s6s00, design s6dNN, folds s6fK; benchmark.RUNS_MBFA).
# Everything else as in Step 5: the physics (option A: FRHS, free air, f_sur 1.4 K fixed, five parts, f_adv 1.0),
# the 40 design points (same seed), the readings, the error model's starting sizes and the rules
# (plans/2026-10-27_step5_rules_plan.md, rules commit 3467851; committed again for this redo).
# First only the 45 grid runs (step5/grid_score.py); the design runs and the fit only once bar 1 of the plan is met.
#
region: CentralEurope
include_estimated: true
include_unassessed: true
run_tag: step5_parts5_mbfa
pool_within: hole_year
exclude_ids: ['01161']
catchment: CentralEurope_fair

calibration_source_dir: /scratch_net/vierzack04_fourth/jabeer/tmp_icetemp_trees/mbfreeair/step3/cal_fa/monthly/CentralEurope/calibration
calibration_source_files: null
air_temperature: freeair

# FRHS
forcing_toff: 'n'
thermal_lapse: reanalysis
hl1980: 'y'
lh_water: 'y'
snow_refreeze: 'y'
orient: table
thermal_air: freeair
freeair_file: /scratch_net/vierzack04_fourth/jabeer/tmp_icetemp_trees/week3/freeair/freeair_CentralEurope.nc
f_sur: 1.4

n_design_points: 40
design_seed: 20261023
bounds_override:
  refreeze_frac: [0.03, 1.0]
fixed_params:
  advection_scale: 1.0

# The rules of step 3 (development_history/plans/2026-10-27_step5_rules_plan.md, approved by Janosch on 28 Oct; rule 6
# read as "0.6 m w.e. per year or less" and rule 7 withdrawn, both 28 Oct). Fit: scripts/icetemp_analysis/step5/
# fit_step5.py; checks: site_checks.py; variants: variants.py; benchmark: benchmark.py.
# Sites by the written rule (holes within 1 km and 150 m, chained); the site table is the check.
sites: rule
# deep old ice: below 40 m wherever the measured accumulation is 0.6 m w.e. per year or less (rule 6 b)
fit_exclusions: ['low_accumulation_below_40m']
# error model C6b, chosen by evidence (error_model_forms.py, week3/step5_error_forms/main_t): band term, borehole,
# borehole-and-year and site terms, each reading's own error in the top 15 m, a multivariate t per site. These are its
# starting sizes (maximum likelihood on fs1_FRHS_r0.85_i1.017_a1.00_fa_fs1.5_oCP_w0); the fit re-estimates them at
# its first result (rule 1).
target: depth
emulator_error: mean
s_model_variance: 2.272
s_model_length_m: 120.807
s_hole_variance: 1.389
s_hole_year_variance: 0.026
s_site_variance: 0.44
s_white_variance: 0.365
s_white_max_depth: 15.0
site_t_nu: 2.561
