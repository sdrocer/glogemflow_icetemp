# Step 5 (the Bayesian calibration), first 40 design points: FRHS with five orientation parts per band
# (plan development_history/plans/2026-10-20_step5_plan.md, step 2; five parts chosen by Janosch on 23 Oct).
#
# DRAFT, ON HOLD (23 Oct): the free air became the base on 23 Oct (plan 2026-10-23_freeair_base_plan.md). The
# parameters that repair its errors (spin-up offset, f_adv, f_ins) come from the runs fb1/fd2 (chapter 14); this
# file is completed from them before any design run (a spin-up offset may become a fixed setting or a design
# dimension).
#
# The physics: FRHS (no T_off in the thermal inputs, ERA5's lapse rate, Herron & Langway meltwater, snow
# refreezing S), ERA5's free air at the bands without surface cooling (GloGEM d783f84, GloGEM_wt_freeair),
# orientation factor on the thermal melt from week3/orient_parts5_fa (free air; gentle; north, east, south, west
# as 90-deg sectors; hole parts week3/orient_parts5/hole_parts.csv).
# Each design point runs once per part (scripts/icetemp_analysis/full_set_runs.py, tag s5) and the five runs are
# merged per borehole (merge_part_runs.py --scheme GNESW) before the emulator; points pooled per hole and year.
#
# Design: f_ref uniform on [0.03, 1.0] (decision 2 of the plan), f_ins its truncated-normal prior on [0.3, 2.0],
# advection fixed at 1.0 (step 1: halved and 1.5x only as test runs at the result). Nothing is fitted until the
# rules of step 3 are committed.

region: CentralEurope
include_estimated: true
include_unassessed: true
run_tag: step5_parts5
pool_within: hole_year
exclude_ids: ['01161']
catchment: CentralEurope_fair

calibration_source_dir: /scratch_net/iceberg_second/mhuss/r7spec_global_results/monthly/CentralEurope/calibration
calibration_source_files:
  - calibrate_m1_cID9_centraleurope.dat
  - calibrate_m1_cID9_centraleurope_final_era5.dat
  - caliphase_statistics_m1_cID9_centraleurope.dat
  - toff_m1_cID9_centraleurope.dat

# FRHS
forcing_toff: 'n'
thermal_lapse: reanalysis
hl1980: 'y'
lh_water: 'y'
snow_refreeze: 'y'
orient: table
thermal_air: freeair
freeair_file: /scratch_net/vierzack04_fourth/jabeer/tmp_icetemp_trees/week3/freeair/freeair_CentralEurope.nc

n_design_points: 40
design_seed: 20261023
bounds_override:
  refreeze_frac: [0.03, 1.0]
fixed_params:
  advection_scale: 1.0
