# Step 5 (the Bayesian calibration), first 40 design points: FRHS on the free air with five orientation parts per
# band (plan development_history/plans/2026-10-20_step5_plan.md, step 2; five parts chosen by Janosch on 23 Oct;
# the free air as the base on 23 Oct, plan 2026-10-23_freeair_base_plan.md; option A on 27 Oct, decision log 16b62dc).
#
# The physics: FRHS (no T_off in the thermal inputs, ERA5's lapse rate, Herron & Langway meltwater, snow
# refreezing S), ERA5's free air at the bands without surface cooling, the thermal surface colder than the air by
# f_sur = 1.4 K, fixed (Gilbert et al. 2014; GloGEM freeair-thermal 61ada09, GloGEM_wt_freeair), orientation factor
# on the thermal melt from week3/orient_parts5_fa (free air; gentle; north, east, south, west as 90-deg sectors;
# hole parts week3/orient_parts5/hole_parts.csv).
# Each design point runs once per part (scripts/icetemp_analysis/full_set_runs.py, run tag s5dNN, chain
# week3/chain_step5.sh), the five runs are merged per borehole (merge_part_runs.py --scheme GNESW) and gathered into
# training_results.pkl (scripts/icetemp_analysis/step5/assemble_training.py); points pooled per hole and year.
# 02_run_training.py cannot run the five parts (orient_dir is per part), so it is not used here.
#
# Design: f_ref uniform on [0.03, 1.0] (decision 2 of the plan), f_ins its truncated-normal prior on [0.3, 2.0],
# advection fixed at 1.0. Calibrated on T2 (every 1 m depth bin); the massif split enters as the site offset.
# Nothing is fitted until the rules of step 3 are committed.

region: CentralEurope
include_estimated: true
include_unassessed: true
run_tag: step5_parts5
pool_within: hole_year
exclude_ids: ['01161']
catchment: CentralEurope_fair

calibration_source_dir: /scratch_net/iceberg_second/mhuss/r7spec_global_results/monthly/CentralEurope/calibration
calibration_source_files:
  - calibrate_m1_cID9_centraleurope.dat
  - calibrate_m1_cID9_centraleurope_final_era5.dat
  - caliphase_statistics_m1_cID9_centraleurope.dat
  - toff_m1_cID9_centraleurope.dat

# FRHS
forcing_toff: 'n'
thermal_lapse: reanalysis
hl1980: 'y'
lh_water: 'y'
snow_refreeze: 'y'
orient: table
thermal_air: freeair
freeair_file: /scratch_net/vierzack04_fourth/jabeer/tmp_icetemp_trees/week3/freeair/freeair_CentralEurope.nc
f_sur: 1.4

n_design_points: 40
design_seed: 20261023
bounds_override:
  refreeze_frac: [0.03, 1.0]
fixed_params:
  advection_scale: 1.0

# The rules of step 3 (development_history/plans/2026-10-27_step5_rules_plan.md, approved by Janosch on 28 Oct; rule 6
# read as "0.6 m w.e. per year or less" and rule 7 withdrawn, both 28 Oct). Fit: scripts/icetemp_analysis/step5/
# fit_step5.py; checks: site_checks.py; variants: variants.py; benchmark: benchmark.py.
# Sites by the written rule (holes within 1 km and 150 m, chained); the site table is the check.
sites: rule
# deep old ice: below 40 m wherever the measured accumulation is 0.6 m w.e. per year or less (rule 6 b)
fit_exclusions: ['low_accumulation_below_40m']
# error model C6b, chosen by evidence (error_model_forms.py, week3/step5_error_forms/main_t): band term, borehole,
# borehole-and-year and site terms, each reading's own error in the top 15 m, a multivariate t per site. These are its
# starting sizes (maximum likelihood on fs1_FRHS_r0.85_i1.017_a1.00_fa_fs1.5_oCP_w0); the fit re-estimates them at
# its first result (rule 1).
target: depth
emulator_error: mean
s_model_variance: 2.272
s_model_length_m: 120.807
s_hole_variance: 1.389
s_hole_year_variance: 0.026
s_site_variance: 0.44
s_white_variance: 0.365
s_white_max_depth: 15.0
site_t_nu: 2.561
