# Tier-3 Bayesian calibration -- CentralEurope, CAMPAIGN 5: corrected physics + corrected
# parameter set + real-model scoring. This is a CLEAN BREAK from campaigns 1-4, not an
# extension of them: no training run from any earlier campaign is reusable, because the forward
# model itself changed (see "physics" below). training_runs/ starts empty by design.
#
# Campaigns 1-4 all concluded "DO NOT ADOPT" on LOO RMSE, and the 2026-08-18 investigation found
# four independent reasons why that verdict was not a fair test of the science:
#
#  (1) WRONG PARAMETER HELD FIXED. Campaigns 1-4 fixed perm_frac at 1.0 and calibrated
#      (dT_scale, z0), justified by a "structural non-identifiability" that describes the PYTHON
#      ANALYTICAL SURROGATE (physics.cp_model_single), NOT the real IDL model. In the real model
#      perm_frac scales the Herron-Langway percolation depth (firnice_temperature_model.pro:89)
#      and never appears in the surface BC, so it is an INDEPENDENT mechanism from dT_scale.
#      Measured on the 245-run campaign-4 training set: spearman(perm_frac, output) = +0.618
#      (p=3e-27). A genuinely influential parameter was being held constant.
#  (2) THE CALIBRATED z0 COULD NOT REACH THE PHYSICS. z0 appears NOWHERE in
#      firnice_temperature_model.pro; initialise_firnicetemp_spinup.pro:189 reads it to build
#      the initial profile, but glogem.pro applies the design-point override AFTERWARDS (line
#      420 builds, 422/425/428 override, nothing recomputes). Measured: spearman(z0, output) =
#      -0.031, p=0.63 -- indistinguishable from zero against a validated control. This is why
#      z0's posterior never narrowed in four campaigns. It is now HELD FIXED at settings.pro's
#      own default and excluded from the GP entirely (Emulator.active_params -- a constant
#      column is degenerate and kills PCGPwM with LinAlgError; jitter was rejected because
#      _nn_distance standardizes per dimension and would let the jitter dominate the metric).
#  (3) KO WAS FIT IN ONE SPACE AND SCORED IN ANOTHER. validation.predict_profile scored every
#      method through the analytical surrogate, including KO, whose theta is fit against the
#      real IDL emulator. Measured gap at the campaign-4 posterior mean: mean |IDL - surrogate|
#      = 2.702 degC, LARGER than Tier-2's entire LOO RMSE of 2.113. Validator now also reports
#      rmse_real_* scored through the real forward model.
#  (4) THREE REAL PHYSICS BUGS WERE ACTIVE IN ALL FOUR CAMPAIGNS (training runs set
#      enable_advection='y'). Fixed in firnice_temperature_model.pro and smoke-tested:
#        B1 ablation-zone emergence advection was UNREACHABLE (ABS(MAX(v)) vs MAX(ABS(v)))
#        B2 velocity shape function was (1-zeta)^4 instead of Nye 1-zeta^(n+1), evaluated in
#           layer-INDEX space, and not renormalised for the depth-averaged u it scales
#        B3 strain heating ~900x too small -- deliberately NOT fixed (user decision; it is off
#           by default so it affected nothing)
#        B4 basal BC was insulating-plus-offset (~0.0042 K/m) instead of a geothermal flux BC
#           (~0.0286 K/m = true G/k), with the bed node wiped every month
#      Smoke test (config/bayescal_smoketest_physicsfix.yaml, 6 pts): 6/6 clean, no PMP
#      violations, and at IDENTICAL theta the fixes changed profiles by up to +2.589 degC mean
#      -- comparable to Tier-2's whole RMSE, i.e. these bugs were materially distorting results.
#
# DESIGN: 150 points, 2D Latin Hypercube over (perm_frac, dT_scale) with z0 constant at 15.0.
# Both dimensions sampled UNIFORMLY over their full physical bounds rather than from the prior
# shape -- an emulator needs even coverage of the space it interpolates, while the prior still
# acts in the likelihood, so this does not bias inference. dT_scale's truncnorm(1,1) prior would
# otherwise leave its upper range nearly unsampled, which is precisely the sparse-edge condition
# that drove campaigns 1-3 to their design boundaries. Coverage check: perm_frac splits
# 33/33/42/42 across [0.1,0.3)/[0.3,0.5)/[0.5,0.75)/[0.75,1.0). Deliberately NOT clustered: the
# clustered supplement in campaign 3 produced a flat LOO-CV variance curve and broke the trust
# gate. design_seed=45 (42/43/44 used by earlier campaigns).
#
# Measured runtime under the new physics: 237 s/point (smoke test) -> ~9.9 h for 150 points.

region: CentralEurope
include_estimated: true
include_unassessed: true
run_tag: centraleurope_physicsfix_pf_dt

calibration_source_dir: /scratch_net/vierzack04_fourth/jabeer/GloGEM/output_template_calibrated/r6_monthly/CentralEurope/calibration
calibration_source_files:
  - calibrate_m1_cID9_centraleurope.dat
  - calibrate_m1_cID9_centraleurope_final_ERA5.dat
  - caliphase_statistics_m1_cID9_centraleurope.dat
  - toff_m1_cID9_centraleurope.dat

# design.csv is hand-written (see above), NOT generated by 01_build_design.py -- the shell
# wrapper's "skip step 1 if design.csv exists" logic reuses it automatically.
n_design_points: 150
design_seed: 45
explained_variance: 0.99
remote_host: vierzack06

# MCMC -- unchanged from campaigns 1-4 so convergence is comparable across the whole series.
n_walkers: 32
n_steps: 30000
burn_in: 5000
thin: 5
mcmc_seed: 42

loo_mode: map
